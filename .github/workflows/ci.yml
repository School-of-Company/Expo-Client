name: Expo_Client CI

# 다른 PR 위에 쌓은 PR(base 가 develop·main 이 아닌 PR)도 검사한다
on:
  pull_request:

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Expo_Client_CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 운영 배포는 Vercel GitHub 연동이 develop push 를 받아 직접 빌드한다. 여기서는 PR 의 lint·빌드만 검사한다
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      # lock 파일 그대로 설치한다
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 타입 검사도 Next 빌드 안에서 함께 한다
      - name: Run Next.js build
        run: npm run build

      # 알림은 develop·main 으로 가는 PR 에만 보낸다. 쌓인 PR 마다 알리지 않는다
      - name: Success Discord Notification
        uses: sarisia/actions-status-discord@v1.11.0
        if: ${{ success() && contains(fromJSON('["develop", "main"]'), github.base_ref) }}
        with:
          webhook: ${{ secrets.WEBHOOK_CI }}
          title: "🎉 Expo Client CI"
          description: "CI success"
          status: ${{ job.status }}
          content: "<@${{ secrets.ID1 }}> <@${{ secrets.ID2 }}>\n확인해주세요."
          username: Expo Client CI bot
          url: "https://github.com/School-of-Company/Expo-Client"
          color: 4CAF50

      - name: Failure notification to discord
        uses: sarisia/actions-status-discord@v1.11.0
        if: ${{ failure() && contains(fromJSON('["develop", "main"]'), github.base_ref) }}
        with:
          webhook: ${{ secrets.WEBHOOK_CI }}
          title: "❌ Expo Client CI"
          description: "CI failed"
          content: "안돼 안바꿔줘 돌아가"
          status: ${{ job.status }}
          username: Expo Client CI bot
          url: "https://github.com/School-of-Company/Expo-Client"
          color: e74c3c
